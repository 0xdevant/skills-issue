name: evals

# Costs real tokens and the results are not deterministic, so this never runs on
# a push. Trigger it by hand after changing a skill's instructions.
on:
  workflow_dispatch:
    inputs:
      skill:
        description: Skill directory to evaluate
        required: true
        default: first-principles

jobs:
  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check the eval suite exists and parses
        run: |
          f="${{ inputs.skill }}/evals/evals.json"
          test -f "$f" || { echo "no eval suite at $f"; exit 1; }
          node -e "const e=require('./$f');console.log(e.evals.length+' evals, '+e.evals.reduce((n,x)=>n+x.expectations.length,0)+' assertions')"

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Run evals
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          test -n "$ANTHROPIC_API_KEY" || { echo "ANTHROPIC_API_KEY secret is not set"; exit 1; }
          mkdir -p eval-output
          node -e "
            const {execFileSync}=require('child_process');
            const fs=require('fs');
            const suite=require('./${{ inputs.skill }}/evals/evals.json');
            for (const e of suite.evals) {
              console.log('=== eval '+e.id+' ===');
              const out=execFileSync('claude',['-p',e.prompt],{encoding:'utf8',maxBuffer:1e8,stdio:['ignore','pipe','pipe']});
              fs.writeFileSync('eval-output/eval-'+e.id+'.txt',
                '# prompt\n'+e.prompt+'\n\n# expected\n'+e.expected_output+
                '\n\n# assertions\n'+e.expectations.join('\n')+'\n\n# output\n'+out);
              console.log(out.slice(0,500));
            }
          "

      - name: Upload outputs for grading
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-output-${{ inputs.skill }}
          path: eval-output/
